<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARETA CRIMINALIS · Estudo Penal</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <script>
    // Aplica o tema salvo (ou o do aparelho) antes de desenhar a página, para não piscar.
    try {
      var tema = localStorage.getItem("areta-tema") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", tema);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "light");
    }
  </script>
  <link rel="stylesheet" href="css/style.css?v=2026-10-06c">
</head>
<body>
  <header class="topo">
    <div class="topo-linha">
      <a class="marca" href="#/inicio">
        <img src="assets/logo.svg" alt="" class="logo">
        <span class="nome">
          <strong>ARETA CRIMINALIS</strong>
          <small>Estudo Penal</small>
        </span>
      </a>
      <div class="topo-botoes">
        <button class="secundario tema" id="btn-tema" aria-label="Alternar entre tema claro e escuro">Tema escuro</button>
        <button class="secundario tema" id="btn-menu" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu-lateral">☰</button>
      </div>
    </div>
  </header>

  <aside id="menu-lateral" class="menu-lateral" hidden>
    <div class="menu-topo">
      <strong>Menu</strong>
      <button class="secundario tema" id="btn-fechar-menu" aria-label="Fechar menu">Fechar ✕</button>
    </div>
    <nav class="abas menu-links" aria-label="Seções">
      <a href="#/inicio" data-aba="inicio">Início</a>
      <a href="#/faculdade" data-aba="faculdade">Faculdade</a>
      <a href="#/complementar" data-aba="complementar">Complementar</a>
      <a href="#/trilha" data-aba="trilha">Trilha</a>
      <a href="#/progresso" data-aba="progresso">Progresso</a>
      <a href="#/glossario" data-aba="glossario">Glossário</a>
      <a href="#/revisao" data-aba="revisao">Revisão</a>
      <a href="#/ensaio" data-aba="ensaio">Ensaio oral</a>
      <a href="#/simulado" data-aba="simulado">Simulado do dia</a>
      <a href="#/nivel" data-aba="nivel">Descubra seu nível</a>
    </nav>
    <section class="menu-conta" id="menu-conta"></section>
  </aside>
  <div id="menu-fundo" class="menu-fundo" hidden></div>

  <main id="app" class="conteudo"></main>

  <div id="popover" class="popover" role="tooltip" hidden></div>

  <footer class="rodape">
    ARETA CRIMINALIS · Material de estudo. Confira sempre o texto atual do Código Penal, da Constituição e as decisões do STF/STJ no site oficial.
  </footer>

  <script src="js/complementar.js"></script>
  <script src="js/faculdade.js"></script>
  <script src="js/conteudo.js"></script>
  <script src="js/glossario.js"></script>
  <script src="js/trilha.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/simulado.js"></script>
  <script src="js/app.js?v=2026-10-06e"></script>
</body>
</html>
